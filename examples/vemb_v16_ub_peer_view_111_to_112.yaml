# Fixed CLI@111 view of UB resources exported by topology owner 1 on host 112.
# owner_id is the topology identity; it is not the host-number alias 112.
# ATTACH offsets remain per-channel dynamic; this manifest selects only the
# client-visible device and mapping policy for each resource role.
# Owner1 receives CLI requests through its export dev10 and writes responses
# through imported dev15.  CLI@111 writes requests through imported dev14 and
# reads responses through export dev11; owner1 warm reads use imported dev16.
version: 1
peer_views:
  - client_host: 111
    owner_id: 1
    resource_role: v1_request_ring
    resource_id: owner112-v1-request
    generation: 1
    provider_path: /dev/obmm_shmdev10
    client_path: /dev/obmm_shmdev14
    map_from_start: true
  - client_host: 111
    owner_id: 1
    resource_role: v1_response_ring
    resource_id: owner112-v1-response
    generation: 1
    provider_path: /dev/obmm_shmdev15
    client_path: /dev/obmm_shmdev11
    map_from_start: true
  - client_host: 111
    owner_id: 1
    resource_role: warm_region
    resource_id: owner112-warm
    generation: 1
    provider_path: /dev/obmm_shmdev12
    client_path: /dev/obmm_shmdev16
    map_from_start: true
  - client_host: 111
    owner_id: 1
    resource_role: v2_request_descriptor
    resource_id: owner112-v2-request-descriptor
    generation: 1
    provider_path: /dev/obmm_shmdev10
    client_path: /dev/obmm_shmdev14
    map_from_start: true
  - client_host: 111
    owner_id: 1
    resource_role: v2_request_arena
    resource_id: owner112-v2-request-arena
    generation: 1
    provider_path: /dev/obmm_shmdev10
    client_path: /dev/obmm_shmdev14
    map_from_start: true
  - client_host: 111
    owner_id: 1
    resource_role: v2_response_descriptor
    resource_id: owner112-v2-response-descriptor
    generation: 1
    provider_path: /dev/obmm_shmdev15
    client_path: /dev/obmm_shmdev11
    map_from_start: true
  - client_host: 111
    owner_id: 1
    resource_role: v2_response_arena
    resource_id: owner112-v2-response-arena
    generation: 1
    provider_path: /dev/obmm_shmdev15
    client_path: /dev/obmm_shmdev11
    map_from_start: true

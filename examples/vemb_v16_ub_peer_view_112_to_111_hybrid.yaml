# Hybrid NC/CC peer view for CLI@112 (owner 0@111).
#
# Request:  NC write → CC read (unchanged, same as original)
#   CLI@112 writes import dev7 (NC) → Server@111 reads export dev3 (CC)
# Response: CC write → NC read (reversed)
#   Server@111 writes export dev2 (CC) → CLI@112 reads import dev6 (NC)
# Warm:     unchanged (dev4 → dev8)
#
# Benchmark script env overrides (only response changes):
#   SERVER_RESPONSE_UB_PATH=/dev/obmm_shmdev2
#   CLIENT_RESPONSE_UB_PATH=/dev/obmm_shmdev6
version: 1
peer_views:
  - client_host: 112
    owner_id: 1
    resource_role: v1_request_ring
    resource_id: owner112-v1-request
    generation: 1
    provider_path: /dev/obmm_shmdev1
    client_path: /dev/obmm_shmdev1
    map_from_start: true
  - client_host: 112
    owner_id: 1
    resource_role: v1_response_ring
    resource_id: owner112-v1-response
    generation: 1
    provider_path: /dev/obmm_shmdev2
    client_path: /dev/obmm_shmdev2
    map_from_start: true
  - client_host: 112
    owner_id: 1
    resource_role: warm_region
    resource_id: owner112-warm
    generation: 1
    provider_path: /dev/obmm_shmdev3
    client_path: /dev/obmm_shmdev3
    map_from_start: true
  - client_host: 112
    owner_id: 1
    resource_role: v2_request_descriptor
    resource_id: owner112-v2-request-descriptor

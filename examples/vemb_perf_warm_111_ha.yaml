# HA-compatible CLI smoke server manifest for node 111.
# The 111->112 client lane uses warm Export dev3 -> peer Import dev7.
# HA Replica reserves dev4 (TX) and dev13 (RX) on 111.
supernode_id: 0
local_ub_node_id: 0
local_region_weight: 8
warm_regions:
  - region_id: 1
    provider: ub
    path: /dev/obmm_shmdev3
    mmap_offset: 0
    bytes: 1073741824
    value_size: 1200
    home_ub_node_id: 0
    weight: 1

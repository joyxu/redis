# Owner 0 @ 111.
# dev3 is the sole local warm/meta export; dev1/dev2 are local CLI rings.
# Startup-complete wiring: region 101 + owner1 meta view arrive via dev16
# (162:dev8) and the ub rpc rings live on dev4 (local) / dev13 (162:dev5),
# so owner resolver and rpc lookup runtime install at boot; runtime
# peer-map attach alone installs neither.
local_ub_node_id: 0
local_region_weight: 4

remote_meta_provider: ub
remote_meta_path: /dev/obmm_shmdev3
remote_meta_mmap_offset: 268435456
remote_meta_entries: 131072
remote_meta_buckets: 262144
ub_rpc_timeout_ms: 2000

warm_regions:
  - region_id: 100
    provider: ub
    path: /dev/obmm_shmdev3
    mmap_offset: 0
    bytes: 1073741824
    value_size: 1200
    home_ub_node_id: 0
    weight: 1
  - region_id: 101
    provider: ub
    path: /dev/obmm_shmdev16
    mmap_offset: 0
    bytes: 1073741824
    value_size: 1200
    home_ub_node_id: 1
    weight: 1

remote_meta_views:
  - owner_id: 1
    provider: ub
    path: /dev/obmm_shmdev16
    mmap_offset: 268435456
    entries: 131072
    buckets: 262144

ub_rpc_peers:
  - owner_id: 1
    provider: ub
    request_path: /dev/obmm_shmdev4
    request_mmap_offset: 134217728
    response_path: /dev/obmm_shmdev13
    response_mmap_offset: 201326592
    inbound_request_path: /dev/obmm_shmdev13
    inbound_request_mmap_offset: 134217728
    outbound_response_path: /dev/obmm_shmdev4
    outbound_response_mmap_offset: 201326592

# Replace interface, addresses, and script paths for the deployment.
vrrp_script chk_hpc_redis {
    script "/opt/hpc-redis/scripts/ha_healthcheck.sh"
    interval 2
    weight -20
    fall 3
    rise 2
}

vrrp_instance HPC_REDIS_HA {
    state BACKUP
    interface eth0
    virtual_router_id 60
    nopreempt
    priority 100                 # use 90 on the peer
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass hpcredis
    }

    virtual_ipaddress {
        10.0.0.100/24
    }

    track_script {
        chk_hpc_redis
    }

    notify_master "/opt/hpc-redis/scripts/ha_notify.sh MASTER"
    notify_backup "/opt/hpc-redis/scripts/ha_notify.sh BACKUP"
    notify_fault "/opt/hpc-redis/scripts/ha_notify.sh FAULT"
}

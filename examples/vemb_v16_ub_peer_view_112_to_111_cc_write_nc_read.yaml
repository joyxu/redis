# CC write → NC read peer view for CLI@112 (owner 0@111).
#
# Reverses the NC write → CC read direction of vemb_v16_ub_peer_view_112_to_111.yaml.
# Producer writes through local export device (CC, O_RDWR succeeds).
# Consumer reads through remote import device (NC, O_RDWR falls back to O_SYNC).
# Device pairs are the same (dev3/dev7, dev6/dev2); provider and client paths are swapped.
#
# Request  (CLI@112 → Server@111): CLI export dev3@112 (CC) → Server import dev7@111 (NC)
# Response (Server@111 → CLI@112): Server export dev2@111 (CC) → CLI import dev6@112 (NC)
# Warm     (Server@111 → CLI@112): unchanged (dev4@111 → dev8@112)
#
# Benchmark script env overrides:
#   SERVER_REQUEST_UB_PATH=/dev/obmm_shmdev7
#   SERVER_RESPONSE_UB_PATH=/dev/obmm_shmdev2
#   CLIENT_REQUEST_UB_PATH=/dev/obmm_shmdev3
#   CLIENT_RESPONSE_UB_PATH=/dev/obmm_shmdev6
version: 1
peer_views:
  - client_host: 112
    owner_id: 1
    resource_role: v1_request_ring
    resource_id: owner112-v1-request
    generation: 1
    provider_path: /dev/obmm_shmdev1
    client_path: /dev/obmm_shmdev1
    map_from_start: true
  - client_host: 112
    owner_id: 1
    resource_role: v1_response_ring
    resource_id: owner112-v1-response
    generation: 1
    provider_path: /dev/obmm_shmdev2
    client_path: /dev/obmm_shmdev2
    map_from_start: true
  - client_host: 112
    owner_id: 1
    resource_role: warm_region
    resource_id: owner112-warm
    generation: 1
    provider_path: /dev/obmm_shmdev3
    client_path: /dev/obmm_shmdev3
    map_from_start: true
  - client_host: 112
    owner_id: 1
    resource_role: v2_request_descriptor
    resource_id: owner112-v2-request-descriptor
    generation: 1
    provider_path: /dev/obmm_shmdev1
    client_path: /dev/obmm_shmdev1
    map_from_start: true
  - client_host: 112
    owner_id: 1
    resource_role: v2_request_arena
    resource_id: owner112-v2-request-arena
    generation: 1
    provider_path: /dev/obmm_shmdev1
    client_path: /dev/obmm_shmdev1
    map_from_start: true
  - client_host: 112
    owner_id: 1
    resource_role: v2_response_descriptor
    resource_id: owner112-v2-response-descriptor
    generation: 1
    provider_path: /dev/obmm_shmdev2
    client_path: /dev/obmm_shmdev2
    map_from_start: true
  - client_host: 112
    owner_id: 1
    resource_role: v2_response_arena
    resource_id: owner112-v2-response-arena
    generation: 1
    provider_path: /dev/obmm_shmdev2
    client_path: /dev/obmm_shmdev2
    map_from_start: true
  - client_host: 112
    owner_id: 0
    resource_role: v1_request_ring
    resource_id: owner111-v1-request
    generation: 1
    provider_path: /dev/obmm_shmdev7
    client_path: /dev/obmm_shmdev3
    map_from_start: true
  - client_host: 112
    owner_id: 0
    resource_role: v1_response_ring
    resource_id: owner111-v1-response
    generation: 1
    provider_path: /dev/obmm_shmdev2
    client_path: /dev/obmm_shmdev6
    map_from_start: true
  - client_host: 112
    owner_id: 0
    resource_role: warm_region
    resource_id: owner111-warm
    generation: 1
    provider_path: /dev/obmm_shmdev4
    client_path: /dev/obmm_shmdev8
    map_from_start: true
  - client_host: 112
    owner_id: 0
    resource_role: v2_request_descriptor
    resource_id: owner111-v2-request-descriptor
    generation: 1
    provider_path: /dev/obmm_shmdev7
    client_path: /dev/obmm_shmdev3
    map_from_start: true
  - client_host: 112
    owner_id: 0
    resource_role: v2_request_arena
    resource_id: owner111-v2-request-arena
    generation: 1
    provider_path: /dev/obmm_shmdev7
    client_path: /dev/obmm_shmdev3
    map_from_start: true
  - client_host: 112
    owner_id: 0
    resource_role: v2_response_descriptor
    resource_id: owner111-v2-response-descriptor
    generation: 1
    provider_path: /dev/obmm_shmdev2
    client_path: /dev/obmm_shmdev6
    map_from_start: true
  - client_host: 112

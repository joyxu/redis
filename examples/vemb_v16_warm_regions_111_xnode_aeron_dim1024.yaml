# Cross-node Aeron warm-region layout (HW01=111 server, HW02=112 client).
# Warm region sits on shmdev4 so the 112_to_111 peer view
# (examples/vemb_v16_ub_peer_view_112_to_111.yaml, provider shmdev3/6/4)
# can translate it for the remote client. Request/response rings stay on
# shmdev3/6 (set by the runner scripts). Same sizing as the shmdev2 loopback
# manifests of the same DIM.
supernode_id: 0
local_ub_node_id: 0
local_region_weight: 1
warm_regions:
  - region_id: 1
    provider: ub
    path: /dev/obmm_shmdev4
    mmap_offset: 0
    bytes: 4294967296
    value_size: 4096
    home_ub_node_id: 0
    weight: 1
